[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "futurium-api"
version = "0.1.0"
description = "Local video processing service for Futurium saved memories"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "numpy==2.3.5",
  "opencv-python-headless==4.14.0.94",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["futurium_api*"]
